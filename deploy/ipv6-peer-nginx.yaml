apiVersion: v1
kind: ConfigMap
metadata:
  name: ipv6-peer-nginx-conf
data:
  default.conf: |
    server {
        listen [::]:80;
        server_name _;
        location / {
            return 200 'ipv6-peer-ok\n';
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: ipv6-peer
  labels:
    app: ipv6-peer
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
          protocol: TCP
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
  volumes:
    - name: nginx-conf
      configMap:
        name: ipv6-peer-nginx-conf
