apiVersion: v1
kind: Pod
metadata:
  name: nat464-demo
  labels:
    app: nat464-demo
  annotations:
    nat464.io/inject: "true"
spec:
  containers:
    # The application container: an unmodified IPv4-only nginx
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
          protocol: TCP

    # The nat464-sidecar: translates IPv6 ↔ IPv4 within the pod
    - name: nat464-sidecar
      image: nat464-sidecar:latest
      args:
        - "--listen-port=8080"
        - "--forward-port=80"
        - "--forward-addr=127.0.0.1"
        - "--proxy-port=1080"
        - "--health-port=9464"
        - "--log-level=info"
      ports:
        - containerPort: 8080
          name: inbound
          protocol: TCP
        - containerPort: 1080
          name: socks5
          protocol: TCP
        - containerPort: 9464
          name: health
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /readyz
          port: 9464
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: 9464
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
